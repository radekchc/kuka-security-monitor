
name: KUKA Security Monitor

on:
  workflow_dispatch:

jobs:
  check-kuka:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sprawdz komunikaty KUKA
        run: python monitor.py
