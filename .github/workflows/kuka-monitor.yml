
name: KUKA Security Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: write
  issues: write

jobs:
  check-kuka:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sprawdz komunikaty KUKA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor.py

      - name: Zapisz nowe alerty w repozytorium
        run: |
          if [ -f kuka-alerts.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add kuka-alerts.txt

            if ! git diff --cached --quiet; then
              git commit -m "KUKA security alert"
              git push
            fi
          fi
